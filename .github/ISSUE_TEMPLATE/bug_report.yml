name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: A clear description of the bug, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open a book ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version / commit
  - type: input
    id: device
    attributes:
      label: Device and iOS version
      placeholder: iPhone 16, iOS 18.4
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, logs, sample file
      description: If a specific EPUB/PDF/MDX triggers the bug, say where to get it (do not upload copyrighted files).
